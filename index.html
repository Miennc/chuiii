<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>chuii</title>
    <meta name="language" content="zh-CN">
    <meta name="github" content="https://github.com/sun0225SUN/Awesome-Love-Code">
    <meta name="describe" content="收集不易，您的star是我坚持的动力，同时也欢迎各位PR哦! ">
    <link rel="icon" type="image/x-icon" href="https://cdn.jsdelivr.net/gh/sun0225SUN/photos/img/20210715233345.png">

    <style>
        html,
        body {
            margin: 0px;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .namebox {
            color: #ff5ba5;
            position: absolute;
            z-index: 9999;
            top: 50%;
            left: 50%;
            -webkit-transform: translate(-50%, -50%);
            -moz-transform: translate(-50%, -50%);
            -ms-transform: translate(-50%, -50%);
            -o-transform: translate(-50%, -50%);
            transform: translate(-50%, -50%);
            transition: 1s;
        }

        .namebox h1 {
            margin: 0 auto;
            white-space: nowrap;
            background: linear-gradient(100deg, #ff5ba5 0%, #ffc9e4 30%, #ffffff 48%, #ffc9e4 64%, #ff5ba5 100%);
            background-size: 220% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 6px rgba(255, 91, 165, .9)) drop-shadow(0 0 20px rgba(255, 48, 197, .45));
            animation: name-shine 3.6s linear infinite, name-float 3.4s ease-in-out infinite;
        }

        #effects-ambient,
        #effects-front {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #pinkboard {
            animation: heartbeat 1.5s ease-in-out infinite;
            transform-origin: 50% 50%;
            will-change: transform;
        }

        .heart-glow {
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(62vmin, 520px);
            height: min(62vmin, 520px);
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(closest-side, rgba(255, 48, 197, .28), rgba(255, 91, 165, .12) 55%, rgba(255, 91, 165, 0) 78%);
            filter: blur(18px);
            animation: glow-pulse 3s ease-in-out infinite;
            pointer-events: none;
            z-index: 8888;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            12% { transform: scale(1.028); }
            24% { transform: scale(1); }
            36% { transform: scale(1.018); }
            50% { transform: scale(1); }
        }

        @keyframes glow-pulse {
            0%, 100% { opacity: .6; transform: translate(-50%, -50%) scale(.96); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
        }

        @keyframes name-shine {
            0% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes name-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
    </style>

</head>

<body>
    <canvas id="canvas-matrix" style="position:absolute;width:100%;height:100%;z-index:8888"></canvas>
    <canvas id="effects-ambient" style="z-index:8888"></canvas>
    <div class="heart-glow"></div>
    <!-- <canvas id="canvas" style="position:absolute;width:100%;height:100%;z-index:8888"></canvas> -->
    <canvas style="position:absolute;width:100%;height:100%;z-index:9999" class="canvas"></canvas>
    <div class="overlay">
        <div class="tabs">
            <div class="tabs-labels"><span class="tabs-label">Commands</span><span class="tabs-label">Info</span><span
                    class="tabs-label">Share</span></div>

            <div class="tabs-panels">
                <ul class="tabs-panel commands">
                </ul>
            </div>
        </div>
    </div>
    <canvas id="pinkboard" style="position:absolute;width:100%;height:100%;z-index:8888"></canvas>
    <canvas id="effects-front" style="z-index:9998"></canvas>

    <script src="js/index.js"></script>
    <script src="js/heart.js"></script>
    <script src="js/matrix.js"></script>
    <script src="js/effects.js"></script>
    <div class="namebox" style="opacity: 0;">
        <h1 style="font-family: 'Comic Sans MS', cursive, sans-serif;">chuiiiiiiiiii</h1>
    </div>

</body>

</html>
